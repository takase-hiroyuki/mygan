<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYGAN Dashboard</title>
    <link rel="icon" href="data:,">
</head>
<body>

    <div id="section-login">
        <h3>プレイヤー登録</h3>
        <div class="flex-row">
            <input type="text" id="input-username" placeholder="あなたの名前を入力">
        </div>
        <button id="btn-login">入室する</button>
    </div>

    <div id="section-guest" class="dashboard-container" hidden>
        
        <div class="module">
            <div class="module-header">システム通知</div>
            <div class="module-content">
                <span id="message-body"></span>
            </div>
        </div>
        
        <div class="col-left">
            <div class="module">
                <div class="module-header red-accent">現在のステータス</div>
                <div class="module-content">
                    <span id="hit"></span>
                    <div class="status-row">
                        <span class="status-label">名前 / 職業</span>
                        <span class="status-value"><span id="g-name">未定</span> / <span id="g-profession"></span></span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">子供 / 養育費</span>
                        <span class="status-value"><span id="g-child-count">0</span>人 / <span id="g-child-expense">0</span></span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">現金</span>
                        <span class="highlight-cash" id="current-cash">0</span>
                    </div>
                </div>
            </div>

            <div class="module">
                <div class="module-header">サイコロ・手番操作</div>
                <div class="module-content">
                    <div>
                        現在地: <span id="dice-result">--</span><br>
                        手番: <span id="dice-user">--</span>
                    </div>
                    <div class="btn-grid">
                        <button id="btn-dice1" disabled>X サイコロ1個</button>
                        <button id="btn-dice2" disabled>X サイコロ2個</button>
                        <button id="btn-paycheck" disabled>X 入金請求</button>
                        <button id="btn-end-turn" disabled>X 次の人へ</button>
                    </div>
                </div>
            </div>

            <div class="module">
                <div class="module-header red-accent">盤面モニター</div>
                <div class="module-content">
                    <table class="board-table">
                        <tbody>
                            <tr>

                                <td><span class="cell-num">01</span><span class="cell-name">娯楽</span><span id="cell-1" class="occupants"></span></td>
                                <td><span class="cell-num">02</span><span class="cell-name">商売</span><span id="cell-2" class="occupants"></span></td>
                                <td class="cell-special"><span class="cell-num">03</span><span class="cell-name">寄付</span><span id="cell-3" class="occupants"></span></td>
                            </tr>

                                <td><span class="cell-num">04</span><span class="cell-name">商売</span><span id="cell-4" class="occupants"></span></td>
